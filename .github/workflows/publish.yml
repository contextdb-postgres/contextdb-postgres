name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'
    branches:
      - main

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write  # For npm provenance

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify schema files are included
        run: |
          test -d schema/ || (echo "ERROR: schema/ directory missing" && exit 1)
          ls schema/*.sql | wc -l | xargs -I{} test {} -ge 5 || (echo "ERROR: Expected at least 5 SQL schema files" && exit 1)
          echo "Schema files verified: $(ls schema/*.sql | wc -l) files"

      - name: Publish to npm
        run: npm publish --provenance --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            schema/*.sql
